name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm run typecheck

      - run: npm run build

      - run: npm run start:api &
        env:
          PORT: 3001

      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3001/api/auth/sso && exit 0
            sleep 1
          done
          exit 1
